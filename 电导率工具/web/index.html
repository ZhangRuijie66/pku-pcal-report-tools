<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电导率实验 · 报告生成器</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e3e6ea; --text:#1d2430; --sub:#5b6472;
  --accent:#1f6feb; --accent2:#0b4fbf; --ok:#1a7f37; --warn:#b45309; --err:#b42318;
  --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.04)}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
header .sub{color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;
  border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--text);
  font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#c9d1da;background:#fafbfc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
main{display:grid;grid-template-columns:390px minmax(0,1fr);gap:14px;padding:14px 18px 40px;align-items:start}
.panel{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--sub);font-weight:700;letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field>label{font-size:12px;color:var(--sub)}
#dataDir{font-size:12.5px}
.field input[type=text],.field input[type=number]{
  width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:7px;
  font:inherit;background:#fff;color:var(--text)}
.field input:focus{outline:2px solid rgba(31,111,235,.18);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow{display:flex;gap:8px;margin-top:2px}
.btnrow .btn{flex:1}
.hint{color:var(--sub);font-size:12px;margin:6px 0 0;line-height:1.55}
.hint code{background:#f1f3f5;border-radius:4px;padding:0 4px;word-break:break-all}
.content{display:flex;flex-direction:column;gap:14px;min-width:0}
.chartbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chartbar select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff;max-width:260px}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:10px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:auto}
.chartbox img{max-width:100%;max-height:480px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center}
th{background:#f7f8fa;color:var(--sub);font-weight:600;white-space:nowrap}
td input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit}
td input:focus{outline:2px solid rgba(31,111,235,.18);border-color:var(--accent)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)}
.msg{padding:8px 10px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;margin:4px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi .item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fafbfc}
.kpi .item .lab{font-size:12px;color:var(--sub)}
.kpi .item .val{font-size:15px;font-weight:700;margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.overlay .box{background:#fff;border-radius:12px;padding:18px 22px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.spin{width:18px;height:18px;border:3px solid #dbe3ee;border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;
  padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:0 0 18px}
@media (max-width:1100px){main{grid-template-columns:1fr}.chartbox img{max-height:380px}}
</style>
</head>
<body>
<header>
  <h1>电导率实验 · 报告生成器</h1>
  <span class="sub" id="status">正在初始化…</span>
  <span class="grow"></span>
  <a class="btn" id="btnHome" href="/" style="display:none">← 返回入口</a>
  <button class="btn" id="btnSaveData">保存测量数据</button>
  <button class="btn" id="btnSaveDefault">存封面为默认</button>
  <button class="btn primary" id="btnExport">一键生成报告 (.docx)</button>
</header>

<main>
  <aside class="panel">
    <section class="card">
      <h2>数据目录</h2>
      <div class="field">
        <label>电导率数据.json 所在文件夹（不存在会自动创建默认数据）</label>
        <input type="text" id="dataDir" placeholder="点「选择文件夹…」或直接粘贴路径">
        <div class="btnrow">
          <button class="btn" id="btnBrowse">选择文件夹…</button>
        </div>
      </div>
      <p class="hint">当前数据文件：<code id="dataPath">—</code></p>
      <p class="hint">输出目录：<code id="outInfo">—</code></p>
    </section>

    <section class="card">
      <h2>报告封面</h2>
      <div class="field"><label>姓名</label><input type="text" id="student_name"></div>
      <div class="field"><label>学号</label><input type="text" id="student_id"></div>
      <div class="grid2">
        <div class="field"><label>组别</label><input type="text" id="group"></div>
        <div class="field"><label>组号</label><input type="text" id="group_no"></div>
      </div>
      <div class="field"><label>实验日期</label><input type="text" id="date" placeholder="如 2026/10/16"></div>
      <div class="grid2">
        <div class="field"><label>室温 /℃</label><input type="number" step="0.1" id="room_temp"></div>
        <div class="field"><label>大气压强 /kPa</label><input type="number" step="0.1" id="pressure"></div>
      </div>
    </section>

    <p class="hint" id="savedInfo"></p>
  </aside>

  <div class="content">
    <section class="card">
      <div class="kpi" id="kpiBox"></div>
    </section>

    <section class="card">
      <h2>标定与基础数据（读数末位不确定度按「最后一位取 2」自动估计）</h2>
      <div class="grid2">
        <div class="field"><label>标注电导池常数 /cm⁻¹</label><input type="text" id="d_cell_constant_label"></div>
        <div class="field"><label>标定后电导池常数 /cm⁻¹</label><input type="text" id="d_cell_constant"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>标注常数下 KCl 读数 /μS·cm⁻¹</label><input type="text" id="d_kcl_label_uS"></div>
        <div class="field"><label>KCl 标准值 /μS·cm⁻¹</label><input type="text" id="d_kcl_theory_uS"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>标定后 KCl 读数 /μS·cm⁻¹</label><input type="text" id="d_kcl_after_uS"></div>
        <div class="field"><label>去离子水 κw /μS·cm⁻¹</label><input type="text" id="d_kappa_w_uS"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>实验温度 /℃</label><input type="text" id="d_temp_c"></div>
        <div class="field"><label>温度补偿系数 /(%·℃⁻¹)</label><input type="text" id="d_compensation"></div>
      </div>
    </section>

    <section class="card">
      <h2>测量数据（浓度 mol·m⁻³、电导率 S·m⁻¹；按原读数的有效位数填写）</h2>
      <div id="solTables"></div>
      <div class="btnrow">
        <button class="btn" id="btnSaveData2">保存测量数据并重算</button>
      </div>
    </section>

    <section class="card">
      <div class="chartbar">
        <h2 style="margin:0">预览</h2>
        <select id="chartKind">
          <option value="kappa_c">图2 · κ校–c 关系曲线</option>
          <option value="fit:NaNO3">图3 · NaNO₃ 拟合</option>
          <option value="fit:NaAc">图4 · NaAc 拟合</option>
          <option value="fit:HNO3">图5 · HNO₃ 拟合</option>
          <option value="kfit">图6 · HAc 拟合直线</option>
        </select>
        <span class="sub" id="chartHint"></span>
      </div>
      <div class="chartbox"><img id="chart" alt="预览图"></div>
    </section>

    <section class="card">
      <h2>关键结果</h2>
      <table id="resTable"></table>
      <p class="hint">拟合不确定度为截距/斜率的标准误；K° 求平均法的合成不确定度 = √(Σσᵢ²)/5。</p>
    </section>

    <section class="card" id="warnCard" style="display:none">
      <h2>提示</h2>
      <div id="warns"></div>
    </section>
  </div>
</main>
<div class="foot">全部计算在本机完成，不联网、不上传数据。报告输出到与报告同名的文件夹，连图一起拷走即可。</div>
<div class="overlay" id="overlay"><div class="box"><div class="spin"></div><div id="overlayText">处理中…</div></div></div>
<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
