<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁化率的测定 - 实验报告生成工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 0;
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 { font-size: 2em; margin-bottom: 10px; }
        header p { opacity: 0.9; }
        .card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .result-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: "Consolas", monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
        .status {
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table th, table td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        table th {
            background: #f8f9fa;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header>
        <h1>磁化率的测定</h1>
        <p>古埃磁天平法测定固体物质的磁化率</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>封面信息</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="student_name" value="张瑞杰">
                </div>
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" id="student_id" value="2400011877">
                </div>
                <div class="form-group">
                    <label>组别</label>
                    <input type="text" id="group" value="3">
                </div>
                <div class="form-group">
                    <label>组号</label>
                    <input type="text" id="group_no" value="8">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>实验日期</label>
                    <input type="text" id="date" value="2026-10-24">
                </div>
                <div class="form-group">
                    <label>室温 / ℃</label>
                    <input type="number" id="room_temp" value="22.0" step="0.1">
                </div>
                <div class="form-group">
                    <label>大气压强 / kPa</label>
                    <input type="number" id="pressure" value="101.3" step="0.1">
                </div>
            </div>
        </div>

        <div class="card">
            <h2>实验数据</h2>
            <div class="form-group">
                <label>数据文件</label>
                <input type="file" id="data_file" accept=".json">
                <div class="hint">支持 JSON 格式的数据文件</div>
            </div>
            <button class="btn btn-secondary" onclick="loadSampleData()">载入示例数据</button>
        </div>

        <div class="card">
            <h2>操作</h2>
            <button class="btn" onclick="generateReport()">生成报告</button>
            <button class="btn btn-secondary" onclick="saveConfig()">保存配置</button>
            <div id="status"></div>
        </div>

        <div class="card">
            <h2>计算结果</h2>
            <div id="results" class="result-box">
                点击"载入示例数据"或上传数据文件后，计算结果将显示在这里。
            </div>
        </div>
    </div>

    <script>
        let currentState = null;

        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                currentState = data;
                updateUI(data);
            } catch (e) {
                console.error('获取状态失败:', e);
            }
        }

        function updateUI(state) {
            if (!state || !state.ok) return;

            // 更新配置
            const cfg = state.config || {};
            document.getElementById('student_name').value = cfg.student_name || '';
            document.getElementById('student_id').value = cfg.student_id || '';
            document.getElementById('group').value = cfg.group || '';
            document.getElementById('group_no').value = cfg.group_no || '';
            document.getElementById('date').value = cfg.date || '';
            document.getElementById('room_temp').value = cfg.room_temp || '';
            document.getElementById('pressure').value = cfg.pressure || '';

            // 更新结果
            if (state.formatted) {
                document.getElementById('results').textContent = state.formatted;
            }
        }

        async function loadSampleData() {
            showStatus('正在载入示例数据...', 'info');
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                if (data.ok) {
                    showStatus('示例数据已载入', 'success');
                    updateUI(data);
                }
            } catch (e) {
                showStatus('载入失败: ' + e.message, 'error');
            }
        }

        async function saveConfig() {
            const config = {
                student_name: document.getElementById('student_name').value,
                student_id: document.getElementById('student_id').value,
                group: document.getElementById('group').value,
                group_no: document.getElementById('group_no').value,
                date: document.getElementById('date').value,
                room_temp: parseFloat(document.getElementById('room_temp').value),
                pressure: parseFloat(document.getElementById('pressure').value),
            };

            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({config})
                });
                const data = await res.json();
                if (data.ok) {
                    showStatus('配置已保存', 'success');
                }
            } catch (e) {
                showStatus('保存失败: ' + e.message, 'error');
            }
        }

        async function generateReport() {
            showStatus('正在生成报告...', 'info');
            try {
                const res = await fetch('/api/export', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                const data = await res.json();
                if (data.ok) {
                    showStatus('报告已生成: ' + data.path, 'success');
                } else {
                    showStatus('生成失败: ' + data.error, 'error');
                }
            } catch (e) {
                showStatus('生成失败: ' + e.message, 'error');
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.className = 'status ' + type;
            el.textContent = msg;
        }

        // 初始化
        fetchState();
    </script>
</body>
</html>
