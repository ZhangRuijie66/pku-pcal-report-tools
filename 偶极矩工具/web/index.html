<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稀溶液法测定极性分子的偶极矩 · 报告生成器</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --text:#1d2430; --sub:#5b6472;
  --accent:#1f6feb; --accent2:#0b4fbf; --ok:#1a7f37; --warn:#b45309; --err:#b42318;
  --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;
  background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.04)}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
header .sub{color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 11px;
  border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--text);
  font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#c9d1da;background:#fafbfc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.mini{padding:2px 7px;font-size:12px;border-radius:6px}
main{display:grid;grid-template-columns:430px minmax(0,1fr);gap:14px;padding:14px 18px 40px;align-items:start}
.panel{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--sub);font-weight:700;letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field>label{font-size:12px;color:var(--sub)}
.field input[type=text],.field input[type=number]{
  width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:7px;
  font:inherit;background:#fff;color:var(--text)}
.field input:focus{outline:2px solid rgba(31,111,235,.18);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btnrow{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.hint{color:var(--sub);font-size:12px;margin:6px 0 0;line-height:1.55}
.hint code{background:#f1f3f5;border-radius:4px;padding:0 4px;word-break:break-all}
.content{display:flex;flex-direction:column;gap:14px;min-width:0}
.chartbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chartbar select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff;max-width:280px}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:10px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:auto}
.chartbox img{max-width:100%;max-height:520px;display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:center}
th{background:#f7f8fa;color:var(--sub);font-weight:600;white-space:nowrap}
td input[type=number]{width:100%;min-width:56px;padding:3px 4px;border:1px solid var(--line);
  border-radius:5px;font:inherit;text-align:center;background:#fff}
td input[type=number]:focus{outline:2px solid rgba(31,111,235,.16);border-color:var(--accent)}
.scroll{overflow-x:auto}
.msg{padding:8px 10px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;margin:4px 0}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.overlay .box{background:#fff;border-radius:12px;padding:18px 22px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.spin{width:18px;height:18px;border:3px solid #dbe3ee;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;
  padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:0 0 18px}
@media (max-width:1150px){main{grid-template-columns:1fr}.chartbox img{max-height:380px}}
</style>
</head>
<body>
<header>
  <h1>稀溶液法测定极性分子的偶极矩 · 报告生成器</h1>
  <span class="sub" id="status">正在初始化…</span>
  <span class="grow"></span>
  <a class="btn" id="btnHome" href="/" style="display:none">← 返回入口</a>
  <button class="btn" id="btnSaveDefault">存为默认</button>
  <button class="btn" id="btnCalc">重新计算</button>
  <button class="btn primary" id="btnExport">一键生成报告 (.docx)</button>
</header>

<main>
  <aside class="panel">
    <section class="card">
      <h2>数据</h2>
      <div class="btnrow">
        <button class="btn" id="btnSample">载入示例数据</button>
        <button class="btn" id="btnSaveData">保存数据</button>
      </div>
      <div class="field" style="margin-top:8px"><label>xlsx / csv 数据文件（课程数据处理表布局，自动识别）</label>
        <input type="file" id="fileInput" accept=".xlsx,.xlsm,.csv,.txt,.tsv" style="padding:4px 0">
      </div>
      <p class="hint">导入只更新称量 / 密度 / 电容 / 折射率这几列；
        实验温度、C′<sub>空</sub>、比重瓶数据不在处理表里，需在下方手工填。
        数据保存在 <code id="dataFile">—</code>。</p>
    </section>

    <section class="card">
      <h2>实验条件</h2>
      <div class="grid3">
        <div class="field"><label>实验温度 /℃</label><input type="number" step="0.1" id="T"></div>
        <div class="field"><label>C′空₁ /pF</label><input type="number" step="0.01" id="c_empty_0"></div>
        <div class="field"><label>C′空₂ /pF</label><input type="number" step="0.01" id="c_empty_1"></div>
      </div>
      <div class="grid4">
        <div class="field"><label>环己烷 ρ /(g·cm⁻³)</label><input type="number" step="0.00001" id="rho_cyc"></div>
        <div class="field"><label>环己烷 C′样 /pF</label><input type="number" step="0.01" id="c_cyc"></div>
        <div class="field"><label>正丁醇 ρ(DE45)</label><input type="number" step="0.00001" id="rho_but"></div>
        <div class="field"><label>正丁醇 n</label><input type="number" step="0.0001" id="n_but"></div>
      </div>
      <div class="grid3">
        <div class="field"><label>比重瓶 m₀ /g</label><input type="number" step="0.001" id="m0"></div>
        <div class="field"><label>m_w（水）/g</label><input type="number" step="0.001" id="mw"></div>
        <div class="field"><label>m_B（正丁醇）/g</label><input type="number" step="0.001" id="mB"></div>
      </div>
    </section>

    <section class="card">
      <h2>处理与文献值</h2>
      <div class="grid2">
        <div class="field"><label>M₁（环己烷）/(g·mol⁻¹)</label><input type="number" step="0.001" id="M1"></div>
        <div class="field"><label>M₂（正丁醇）/(g·mol⁻¹)</label><input type="number" step="0.001" id="M2"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>μ 文献值 /D</label><input type="number" step="0.01" id="lit_mu"></div>
        <div class="field"><label>电容误差假设 σ_C′ /pF</label><input type="number" step="0.005" id="sigma_c_check"></div>
      </div>
      <div class="grid3">
        <div class="field"><label>σ_n（假设）</label><input type="number" step="0.0001" id="sigma_n"></div>
        <div class="field"><label>σ_ρ₂（假设）</label><input type="number" step="0.00001" id="sigma_rho2"></div>
        <div class="field"><label>温度波动假设 /℃</label><input type="number" step="0.5" id="sigma_T_check"></div>
      </div>
      <p class="hint">σ_n、σ_ρ₂ 是参考报告口径的假设值；σ_C′ 只用于 4.1.1 的
        「若每个电容读数有 0.01 pF 误差」的估算。</p>
    </section>

    <section class="card">
      <h2>报告封面</h2>
      <div class="field"><label>姓名</label><input type="text" id="student_name"></div>
      <div class="field"><label>学号</label><input type="text" id="student_id"></div>
      <div class="grid2">
        <div class="field"><label>组别</label><input type="text" id="group"></div>
        <div class="field"><label>组号</label><input type="text" id="group_no"></div>
      </div>
      <div class="field"><label>实验日期</label><input type="text" id="date"></div>
      <div class="grid2">
        <div class="field"><label>室温 /℃</label><input type="number" step="0.1" id="room_temp"></div>
        <div class="field"><label>大气压强 /kPa</label><input type="number" step="0.1" id="pressure"></div>
      </div>
    </section>

    <section class="card">
      <h2>五组溶液</h2>
      <div class="scroll"><table id="solTable"></table></div>
      <div class="btnrow">
        <button class="btn mini" id="btnAddSol">+ 添加一行</button>
        <span class="hint" style="margin:0">m₁ 正丁醇质量、m₂ 溶液总质量、C′样 可填两次平行。</span>
      </div>
    </section>
  </aside>

  <div class="content">
    <section class="card">
      <div class="chartbar">
        <h2 style="margin:0">预览</h2>
        <select id="chartKind">
          <option value="eps_fit">ε – x 拟合直线</option>
          <option value="rho_fit">ρ – x 拟合直线</option>
        </select>
        <span class="sub" id="chartHint"></span>
      </div>
      <div class="chartbox"><img id="chart" alt="预览图"></div>
    </section>

    <section class="card">
      <h2>结果</h2>
      <div class="scroll"><table id="resultTable"></table></div>
      <p class="hint" id="resultNote"></p>
    </section>

    <section class="card" id="warnCard" style="display:none">
      <h2>提示</h2>
      <div id="warns"></div>
    </section>
  </div>
</main>
<div class="foot">全部计算在本机完成，不联网、不上传数据。报告输出到与报告同名的文件夹，连图一起拷走即可。</div>
<div class="overlay" id="overlay"><div class="box"><div class="spin"></div><div id="overlayText">处理中…</div></div></div>
<div class="toast" id="toast"></div>
<script src="/static/draft.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
